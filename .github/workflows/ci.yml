name: verify
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TRIAGE_PROVIDER: baseline
  RETRIEVAL_BACKEND: memory

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage -d triage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://triage:triage@localhost:5432/triage
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          python-version: "3.12.12"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check triage_lab tests scripts evals/generate.py
      - run: uv run --frozen pytest -q
      - run: uv run --frozen triage-eval --transport stdio --provider baseline --output artifacts/evals/ci
      - uses: actions/upload-artifact@v4
        with:
          name: measured-evaluation
          path: artifacts/evals/ci

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          python-version: "3.12.12"
      - run: uv sync --frozen --extra dev
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: uv run python scripts/smoke_lab.py --output artifacts/docker-smoke.json
      - if: always()
        run: docker compose logs --no-color > artifacts/compose.log
      - if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke
          path: |
            artifacts/docker-smoke.json
            artifacts/compose.log
